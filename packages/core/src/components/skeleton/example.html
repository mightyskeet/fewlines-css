<!doctype html>
<!-- Skeleton examples. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Skeleton examples</title>
    <link rel="stylesheet" href="../../../../dist/index.css" />
  </head>
  <body>
    <h1>Skeleton</h1>

    <h2>Text lines (defaults)</h2>
    <div aria-busy="true">
      <span class="ui-skeleton" style="inline-size: 80%"></span>
      <span class="ui-skeleton" style="inline-size: 100%"></span>
      <span class="ui-skeleton" style="inline-size: 60%"></span>
    </div>

    <h2>Avatar + lines (host geometry)</h2>
    <div aria-busy="true" style="display: flex; gap: 1rem; align-items: flex-start">
      <span
        class="ui-skeleton"
        style="inline-size: 2.5rem; block-size: 2.5rem; --ui-skeleton-radius: var(--ui-radius-full)"
      ></span>
      <div style="flex: 1">
        <span class="ui-skeleton" style="inline-size: 30%"></span>
        <span class="ui-skeleton" style="inline-size: 100%"></span>
      </div>
    </div>

    <h2>Card block</h2>
    <span
      class="ui-skeleton"
      style="inline-size: 16rem; block-size: 8rem; --ui-skeleton-radius: var(--ui-radius-lg)"
      aria-hidden="true"
    ></span>
  </body>
</html>
