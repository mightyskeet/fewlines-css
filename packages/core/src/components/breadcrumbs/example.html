<!doctype html>
<!-- Breadcrumbs examples. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Breadcrumbs examples</title>
    <link rel="stylesheet" href="../../../../dist/index.css" />
    <style>
      body {
        padding: 1rem;
        max-width: 40rem;
      }
    </style>
  </head>
  <body>
    <nav class="ui-breadcrumbs" aria-label="Breadcrumb">
      <ol role="list">
        <li><a href="#">Home</a></li>
        <li><a href="#">Library</a></li>
        <li aria-current="page">Data</li>
      </ol>
    </nav>

    <nav class="ui-breadcrumbs" aria-label="Breadcrumb" style="margin-block-start: 2rem">
      <ol role="list">
        <li><a href="#">Home</a></li>
        <li>
          <button
            class="ui-popover-trigger"
            type="button"
            popovertarget="bc-more"
            aria-label="Hidden levels"
          >
            …
          </button>
        </li>
        <li><a href="#">Data</a></li>
        <li aria-current="page">very-long-name-of-the-current-page</li>
      </ol>
      <menu class="ui-popover ui-menu" id="bc-more" popover>
        <li><a class="ui-menu-item" href="#">Projects</a></li>
        <li><a class="ui-menu-item" href="#">Archive</a></li>
      </menu>
    </nav>
  </body>
</html>
