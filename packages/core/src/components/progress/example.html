<!doctype html>
<!-- Progress examples. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Progress examples</title>
    <link rel="stylesheet" href="../../../../dist/index.css" />
  </head>
  <body>
    <h1>Progress</h1>

    <h2>Determinate</h2>
    <progress class="ui-progress" max="100" value="70" aria-label="Uploading: 70%"></progress>

    <h2>Indeterminate (no value attribute)</h2>
    <progress class="ui-progress" aria-label="Loading"></progress>

    <h2>Sizes</h2>
    <progress class="ui-progress" data-size="sm" max="100" value="40" aria-label="Small"></progress>
    <progress class="ui-progress" max="100" value="40" aria-label="Default"></progress>
    <progress class="ui-progress" data-size="lg" max="100" value="40" aria-label="Large"></progress>
  </body>
</html>
