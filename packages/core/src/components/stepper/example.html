<!doctype html>
<!-- Stepper examples. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Stepper examples</title>
    <link rel="stylesheet" href="../../../../dist/index.css" />
    <style>
      body {
        padding: 1rem;
        max-width: 40rem;
      }
    </style>
  </head>
  <body>
    <ol class="ui-stepper" role="list">
      <li data-done><a href="#">Cart</a></li>
      <li aria-current="step"><a href="#">Checkout</a></li>
      <li>Review</li>
    </ol>

    <ol
      class="ui-stepper"
      data-orientation="horizontal"
      role="list"
      style="margin-block-start: 2rem"
    >
      <li data-done><a href="#">Cart</a></li>
      <li aria-current="step"><a href="#">Checkout</a></li>
      <li>Review</li>
    </ol>
  </body>
</html>
