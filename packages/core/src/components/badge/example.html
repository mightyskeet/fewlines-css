<!doctype html>
<!-- Badge examples. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Badge examples</title>
    <link rel="stylesheet" href="../../../../dist/index.css" />
  </head>
  <body>
    <h1>Badge</h1>

    <h2>Default (neutral)</h2>
    <span class="ui-badge">Beta</span>

    <h2>Variants</h2>
    <span class="ui-badge">Default</span>
    <span class="ui-badge" data-variant="neutral">Neutral</span>
    <span class="ui-badge" data-variant="attention">Failed</span>

    <h2>Counters (host supplies the accessible name)</h2>
    <p>
      <span class="ui-badge" data-variant="attention" aria-label="3 unread messages">3</span>
      Unread
    </p>

    <h2>Inline with text</h2>
    <p>Service <span class="ui-badge" data-variant="neutral">Degraded</span> since 14:02 UTC.</p>
  </body>
</html>
