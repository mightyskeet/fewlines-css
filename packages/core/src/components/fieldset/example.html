<!doctype html>
<!-- Fieldset examples. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Fieldset examples</title>
    <link rel="stylesheet" href="../../../../dist/index.css" />
  </head>
  <body>
    <h1>Fieldset</h1>

    <h2>Group of fields</h2>
    <fieldset class="ui-fieldset">
      <legend class="ui-fieldset-legend">Shipping address</legend>
      <label class="ui-field">
        <span class="ui-field-label">Street</span>
        <input class="ui-input" type="text" placeholder="Main st. 1" />
      </label>
      <label class="ui-field">
        <span class="ui-field-label">City</span>
        <input class="ui-input" type="text" placeholder="Springfield" />
      </label>
    </fieldset>

    <h2>Radio group (Choice members)</h2>
    <fieldset class="ui-fieldset">
      <legend class="ui-fieldset-legend">Delivery speed</legend>
      <label class="ui-choice-field">
        <input class="ui-radio" type="radio" name="speed" value="standard" checked />
        <span class="ui-choice-label">Standard</span>
      </label>
      <label class="ui-choice-field">
        <input class="ui-radio" type="radio" name="speed" value="express" />
        <span class="ui-choice-label">Express</span>
      </label>
    </fieldset>

    <h2>Disabled group (native propagation)</h2>
    <fieldset class="ui-fieldset" disabled>
      <legend class="ui-fieldset-legend">Beta options</legend>
      <label class="ui-field">
        <span class="ui-field-label">Access key</span>
        <input class="ui-input" type="text" value="sk-…" />
      </label>
    </fieldset>

    <h2>Stacked groups</h2>
    <fieldset class="ui-fieldset">
      <legend class="ui-fieldset-legend">Billing</legend>
      <label class="ui-field">
        <span class="ui-field-label">Card number</span>
        <input class="ui-input" type="text" />
      </label>
    </fieldset>
    <fieldset class="ui-fieldset">
      <legend class="ui-fieldset-legend">Shipping</legend>
      <label class="ui-field">
        <span class="ui-field-label">Address</span>
        <input class="ui-input" type="text" />
      </label>
    </fieldset>
  </body>
</html>
