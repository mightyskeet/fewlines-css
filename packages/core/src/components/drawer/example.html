<!doctype html>
<!-- Drawer examples. popovertarget is declarative; core has no runtime JS. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Drawer examples</title>
    <link rel="stylesheet" href="../../../../dist/index.css" />
  </head>
  <body>
    <h1>Drawer</h1>

    <button class="ui-button" type="button" popovertarget="cart">Open end drawer</button>

    <aside class="ui-drawer" id="cart" popover data-variant="drawer-end">
      <h2>Cart</h2>
      <p>Non-modal edge panel: the page stays interactive. Escape or an outside click closes it.</p>
      <button
        class="ui-button"
        type="button"
        popovertarget="cart"
        popovertargetaction="hide"
        autofocus
      >
        Close
      </button>
    </aside>

    <button class="ui-button" type="button" popovertarget="menu">Open start drawer</button>

    <nav class="ui-drawer" id="menu" popover aria-label="Mobile menu">
      <h2>Menu</h2>
      <p>Default variant: pinned to the logical inline-start edge.</p>
      <button
        class="ui-button"
        type="button"
        popovertarget="menu"
        popovertargetaction="hide"
        autofocus
      >
        Close
      </button>
    </nav>
  </body>
</html>
