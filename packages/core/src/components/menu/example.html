<!doctype html>
<!-- Menu examples. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Menu — @fewlines/css</title>
    <link rel="stylesheet" href="../../dist/index.css" />
  </head>
  <body>
    <h1>Menu</h1>

    <h2>Actions menu</h2>
    <button class="ui-button ui-popover-trigger" type="button" popovertarget="m1">Actions</button>
    <menu class="ui-popover ui-menu" id="m1" popover>
      <li>
        <button class="ui-menu-item" type="button" command="hide-popover" commandfor="m1">
          Rename
        </button>
      </li>
      <li>
        <button class="ui-menu-item" type="button" command="hide-popover" commandfor="m1">
          Duplicate
        </button>
      </li>
      <li><hr class="ui-divider" /></li>
      <li>
        <button
          class="ui-menu-item"
          type="button"
          data-variant="attention"
          command="hide-popover"
          commandfor="m1"
        >
          Delete
        </button>
      </li>
    </menu>

    <h2>Navigation menu (links)</h2>
    <button class="ui-button ui-popover-trigger" type="button" popovertarget="m2">Sections</button>
    <menu class="ui-popover ui-menu" id="m2" popover>
      <li><a class="ui-menu-item" href="#docs">Documentation</a></li>
      <li><a class="ui-menu-item" href="#examples">Examples</a></li>
      <li>
        <a class="ui-menu-item" href="#disabled" aria-disabled="true">Draft page (disabled)</a>
      </li>
    </menu>
  </body>
</html>
