<!doctype html>
<!-- Button examples. Each block is a canonical markup sample. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Button examples</title>
    <link rel="stylesheet" href="../../../../dist/index.css" />
  </head>
  <body>
    <h1>Button</h1>

    <h2>Variants</h2>
    <button class="ui-button" type="button">Secondary</button>
    <button class="ui-button" type="button" data-variant="primary">Primary</button>
    <button class="ui-button" type="button" data-variant="destructive">Delete</button>

    <h2>Sizes</h2>
    <button class="ui-button" type="button" data-size="sm">Small</button>
    <button class="ui-button" type="button">Medium</button>
    <button class="ui-button" type="button" data-size="lg">Large</button>

    <h2>States</h2>
    <button class="ui-button" type="button" disabled>Disabled</button>
    <a class="ui-button" href="#">Link as button</a>
  </body>
</html>
