<!doctype html>
<!-- Divider examples. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Divider examples</title>
    <link rel="stylesheet" href="../../../../dist/index.css" />
  </head>
  <body>
    <h1>Divider</h1>

    <h2>Default (solid)</h2>
    <p>Content above the break.</p>
    <hr class="ui-divider" />
    <p>Content below the break.</p>

    <h2>Variants</h2>
    <hr class="ui-divider" />
    <hr class="ui-divider" data-variant="dashed" />
    <hr class="ui-divider" data-variant="strong" />

    <h2>Inset</h2>
    <hr class="ui-divider" data-inset="start" />
    <hr class="ui-divider" data-inset="both" />
    <hr class="ui-divider" data-variant="dashed" data-inset="start" />

    <h2>Sizes</h2>
    <hr class="ui-divider" data-size="sm" />
    <hr class="ui-divider" data-size="lg" />
  </body>
</html>
