<!doctype html>
<!-- Switch examples. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Switch examples</title>
    <link rel="stylesheet" href="../../../../dist/index.css" />
  </head>
  <body>
    <h1>Switch</h1>

    <h2>States</h2>
    <label class="ui-switch-field">
      <input class="ui-switch" type="checkbox" switch />
      <span class="ui-switch-label">Email notifications</span>
    </label>
    <label class="ui-switch-field">
      <input class="ui-switch" type="checkbox" switch checked />
      <span class="ui-switch-label">Push notifications (on)</span>
    </label>
    <label class="ui-switch-field">
      <input class="ui-switch" type="checkbox" switch disabled />
      <span class="ui-switch-label">Disabled</span>
    </label>
    <label class="ui-switch-field">
      <input class="ui-switch" type="checkbox" switch checked disabled />
      <span class="ui-switch-label">Disabled and on</span>
    </label>

    <h2>Required consent (user-invalid after interaction)</h2>
    <form>
      <label class="ui-switch-field">
        <input class="ui-switch" type="checkbox" switch required />
        <span class="ui-switch-label">I accept the terms</span>
      </label>
      <button class="ui-button" type="submit">Continue</button>
    </form>

    <h2>Hint via aria-describedby</h2>
    <label class="ui-switch-field">
      <input class="ui-switch" type="checkbox" switch aria-describedby="beta-hint" />
      <span class="ui-switch-label">Beta features</span>
    </label>
    <p id="beta-hint">Unreleased functionality may change without notice.</p>
  </body>
</html>
