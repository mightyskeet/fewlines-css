<!doctype html>
<!-- Test fixture: all components in one page with stable ids for tests. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>@fewlines/css test fixture</title>
    <link rel="stylesheet" href="/core.css" />
  </head>
  <body>
    <main>
      <!-- Button -->
      <section id="buttons">
        <button class="ui-button" type="button" id="btn-secondary">Secondary</button>
        <button class="ui-button" type="button" id="btn-primary" data-variant="primary">
          Primary
        </button>
        <button class="ui-button" type="button" id="btn-destructive" data-variant="destructive">
          Delete
        </button>
        <button class="ui-button" type="button" id="btn-disabled" disabled>Disabled</button>
      </section>

      <!-- Field -->
      <section id="fields">
        <form id="test-form">
          <label class="ui-field">
            <span class="ui-field-label">Email</span>
            <input
              class="ui-input"
              type="email"
              id="input-email"
              required
              placeholder="you@example.com"
            />
            <span class="ui-field-description" id="email-hint">We never share your email.</span>
          </label>
          <label class="ui-field">
            <span class="ui-field-label">Disabled</span>
            <input class="ui-input" type="text" id="input-disabled" disabled />
          </label>
          <label class="ui-field">
            <span class="ui-field-label">Message</span>
            <textarea
              class="ui-textarea"
              id="input-textarea"
              placeholder="Grows with content"
            ></textarea>
          </label>
          <button class="ui-button" type="submit" id="form-submit">Submit</button>
        </form>
      </section>

      <!-- Dialog -->
      <section id="dialogs">
        <button class="ui-button" type="button" id="dialog-open" onclick="testDialog.showModal()">
          Open dialog
        </button>
        <dialog class="ui-dialog" id="testDialog">
          <h2>Confirm</h2>
          <p>Native modal dialog.</p>
          <form method="dialog">
            <button class="ui-button" type="button" id="dialog-cancel">Cancel</button>
            <button class="ui-button" type="submit" id="dialog-close">Close</button>
          </form>
        </dialog>
      </section>

      <!-- Popover -->
      <section id="popovers">
        <button
          class="ui-button ui-popover-trigger"
          type="button"
          popovertarget="testPopover"
          id="popover-trigger"
        >
          Options
        </button>
        <div class="ui-popover" id="testPopover" popover>
          <p>Popover content</p>
        </div>
      </section>

      <!-- Alert -->
      <section id="alerts">
        <div class="ui-alert" id="alert-info">
          <p class="ui-alert-title">Heads up</p>
          <p class="ui-alert-body">A new version is available.</p>
        </div>
        <div class="ui-alert" data-variant="success" id="alert-success">
          <p class="ui-alert-title">Saved</p>
          <p class="ui-alert-body">Your changes were stored.</p>
        </div>
        <div class="ui-alert" data-variant="warning" id="alert-warning" role="status">
          <p class="ui-alert-title">Session expiring</p>
          <p class="ui-alert-body">You will be signed out in 5 minutes.</p>
        </div>
        <div class="ui-alert" data-variant="danger" id="alert-danger" role="alert">
          <p class="ui-alert-title">Payment failed</p>
          <p class="ui-alert-body">Card was declined. Try another card.</p>
        </div>
      </section>

      <!-- Accordion -->
      <section id="accordions">
        <details class="ui-accordion" id="accordion-first">
          <summary class="ui-accordion-summary" id="accordion-summary-first">
            First question
          </summary>
          <div class="ui-accordion-content"><p>Answer one.</p></div>
        </details>
        <details class="ui-accordion" id="accordion-second">
          <summary class="ui-accordion-summary" id="accordion-summary-second">
            Second question
          </summary>
          <div class="ui-accordion-content"><p>Answer two.</p></div>
        </details>
      </section>
    </main>
  </body>
</html>
