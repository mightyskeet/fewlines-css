name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    # ubuntu-latest is 26.04 now; playwright 1.57 --with-deps has no 26.04 package list yet
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        # version comes from packageManager field in package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (stylelint)
        run: pnpm lint

      - name: Build (Lightning CSS)
        run: pnpm build

      - name: Format check (prettier)
        run: pnpm format:check

      - name: APCA token matrix
        run: node tests/apca/check.mjs

      - name: Package purity
        run: node tests/purity/check.mjs

      - name: Playwright version
        id: pw
        working-directory: tests
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ steps.pw.outputs.version }}

      - name: Install Playwright browser
        # no --with-deps: apt font pulls die on flaky DNS to azure mirrors; runner libs suffice
        run: npx playwright install chromium
        working-directory: tests

      - name: Browser + accessibility tests
        run: pnpm test
        working-directory: tests

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: tests/playwright-report/
          retention-days: 7
